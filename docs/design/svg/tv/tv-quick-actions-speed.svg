<?xml version="1.0" encoding="UTF-8"?>
<!--
  Giffy Viewer — TV mockup: tv-quick-actions-speed.svg (player variant)
  Source: app-tv/src/main/kotlin/com/rjbiermann/giffyviewer/tv/TvQuickActions.kt
          (TvQuickActionsDialog with playerActions != null → HorizontalDivider +
           Like / Mute (hasAudio) / SpeedAdjustRow (SLICE-13) / Auto-swipe rows).
  Shown: the player's quick-actions with the SpeedAdjustRow FOCUSED (LEFT/RIGHT
  adjust ±0.25 — held keys repeat via OS key-repeat, clamp [0.5, 2.0]; the
  click is a no-op — the row is display-only, the value lives in the label
  "Speed %.2f× — ‹ › to adjust" (String.format Locale.US)).
  Rows carry the issue-#7 tokens: rest primary #FF668F / onPrimary #5E0B25,
  focus primaryContainer #7D0030 / onPrimaryContainer #FFD9E1 + 3dp primary
  border + soft glow. Focus tokens keep the visible-focus treatment while the
  row consumes the directional KeyDowns.
  Scale note: ~1.5 px per dp (1080p TV). Dialog = 420 dp wide M3 Surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DM Sans, sans-serif">
  <!-- Screen behind the dialog scrim (M3 Dialog dims the background) -->
  <rect x="0" y="0" width="1920" height="1080" fill="#161617"/>
  <!-- dimmed player surface behind -->
  <rect x="0" y="270" width="1920" height="540" fill="#241B1D"/>
  <rect x="0" y="0" width="1920" height="1080" fill="#000000" fill-opacity="0.55"/>

  <!-- Dialog Surface: shapes.medium 12dp; tonalElevation 6dp container tone -->
  <rect x="645" y="170" width="630" height="352" rx="18" fill="#221D1E"/>

  <!-- Header: CreatorLabel titleMedium 16sp -->
  <text x="669" y="214" font-size="24" font-weight="500" fill="#F7E9EC">@crtglow</text>
  <circle cx="792" cy="206" r="8" fill="#F7E9EC"/>

  <!-- Divider between the header and the player-only rows (playerActions) -->
  <line x1="669" y1="226" x2="1251" y2="226" stroke="#51444A" stroke-width="2"/>

  <!-- Rows. SpeedAdjustRow FOCUSED. -->
  <g id="player-rows">
    <rect x="645" y="236" width="630" height="56" rx="18" fill="#FF668F"/>
    <text x="960" y="273" font-size="21" fill="#5E0B25" text-anchor="middle">Like</text>

    <rect x="645" y="298" width="630" height="56" rx="18" fill="#FF668F"/>
    <text x="960" y="335" font-size="21" fill="#5E0B25" text-anchor="middle">Mute</text>

    <rect x="637" y="361" width="646" height="62" rx="20" fill="none" stroke="#FF668F" stroke-width="11" stroke-opacity="0.18"/>
    <rect x="645" y="364" width="630" height="56" rx="18" fill="#7D0030" stroke="#FF668F" stroke-width="4.5"/>
    <text x="960" y="401" font-size="21" fill="#FFD9E1" text-anchor="middle">Speed 1.25× — ‹ › to adjust</text>

    <rect x="645" y="426" width="630" height="56" rx="18" fill="#FF668F"/>
    <text x="960" y="463" font-size="21" fill="#5E0B25" text-anchor="middle">Auto-swipe next: ON</text>
  </g>

  <!-- ===== SpeedAdjustRow notes (right side) ===== -->
  <g id="speed-notes">
    <line x1="1283" y1="392" x2="1320" y2="392" stroke="#9C7A80" stroke-width="2"/>
    <text x="1336" y="400" font-size="22" font-weight="600" fill="#F7E9EC">SpeedAdjustRow (SLICE-13)</text>
    <g font-size="18" fill="#DCA1AB">
      <text x="1336" y="438">D-pad slider while focused:</text>
      <text x="1336" y="466">‹ › adjust ±0.25 (SPEED_STEP);</text>
      <text x="1336" y="494">held keys repeat via OS key-repeat;</text>
      <text x="1336" y="522">clamp [0.5, 2.0] — the mobile</text>
      <text x="1336" y="550">slider's range, quarter-grid snap.</text>
      <text x="1336" y="586">Center = no-op (display-only row —</text>
      <text x="1336" y="614">the consumed KeyDown keeps focus in</text>
      <text x="1336" y="642">the row; the value lives in the label).</text>
      <text x="1336" y="678">Like/Mute/Auto-swipe writes dismiss</text>
      <text x="1336" y="706">the panel; the Speed row never does.</text>
    </g>
  </g>
</svg>
