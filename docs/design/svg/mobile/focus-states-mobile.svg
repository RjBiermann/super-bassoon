<text x="175" y="441" font-family="Roboto, sans-serif" font-size="12" fill="#EADDFF" text-anchor="middle">Chip</text>
<text x="20" y="478" font-family="Roboto, sans-serif" font-size="10" fill="#CAC4D0">giffyFocus: 3 dp primary border + primaryContainer fill (animate on focus)</text>
<text x="20" y="496" font-family="Roboto, sans-serif" font-size="10" fill="#CAC4D0">no-op on touch — focus lands via D-pad/keyboard only (TV hosting); pass the</text>
