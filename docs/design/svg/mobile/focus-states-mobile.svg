<text x="20" y="152" font-family="Roboto, sans-serif" font-size="10" fill="#CAC4D0">rest: onSurface @ 8% fill · 1 dp primary outline</text>
<text x="170" y="152" font-family="Roboto, sans-serif" font-size="10" fill="#CAC4D0">focused/pressed: primaryContainer fill · onPrimaryContainer text</text>
<text x="20" y="192" font-family="Roboto, sans-serif" font-size="12" fill="#E6E1E5" font-weight="500">Tile focus treatment — GifTile (touch-first, combinedClickable)</text>
