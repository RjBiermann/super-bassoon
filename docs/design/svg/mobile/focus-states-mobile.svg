<text x="210" y="346" font-family="Roboto, sans-serif" font-size="10" fill="#CAC4D0">focused — identical: GifTile draws no</text>
<text x="210" y="360" font-family="Roboto, sans-serif" font-size="10" fill="#CAC4D0">focus ring (giffyFocus not applied to tiles)</text>
<line x1="196" y1="268" x2="206" y2="268" stroke="#CAC4D0" stroke-width="2"/>
<path d="M 203 264 L 208 268 L 203 272" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round"/>
<text x="20" y="404" font-family="Roboto, sans-serif" font-size="12" fill="#E6E1E5" font-weight="500">For contrast: rows/chips DO get the giffyFocus ring</text>
