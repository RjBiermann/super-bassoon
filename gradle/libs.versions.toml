activityCompose = "1.13.0"
coreKtx = "1.19.0"
junit = "4.13.2"
detekt = "1.23.8"
ktlintPlugin = "13.1.0"
room = "2.8.5"
paging = "3.5.1"
datastore = "1.2.1"
hilt = "2.60.1"
