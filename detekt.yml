# Giffy Viewer detekt config — default ruleset, tuned for Compose-era Kotlin.
build:
  maxIssues: 0
complexity:
  LongMethod:
    active: false
  LargeClass:
    active: false
  TooManyFunctions:
    active: true
    thresholdInFiles: 13 # TvHomeScreen pure mappings (row-size slice 11 + SLICE-12 hint copy)
    thresholdInInterfaces: 40 # one wide data-access surface per file is by design (ContentPrefsDao, GifsApi)
    thresholdInClasses: 40 # wide data-access fakes (ContentPrefsDao, GifsApi fakes) are one class by design
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
exceptions:
  TooGenericExceptionCaught:
    active: false
naming:
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false
