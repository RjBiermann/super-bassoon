# Giffy Viewer detekt config — default ruleset, tuned for Compose-era Kotlin.
build:
  maxIssues: 0
complexity:
  LongMethod:
    active: false
  LargeClass:
    active: false
  TooManyFunctions:
    active: true
    thresholdInInterfaces: 23 # ContentPrefsDao is one wide data-access surface (tags+creators+keywords)
    thresholdInClasses: 23 # wide data-access fakes (ContentPrefsDao fake) are one class by design
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
exceptions:
  TooGenericExceptionCaught:
    active: false
naming:
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false
