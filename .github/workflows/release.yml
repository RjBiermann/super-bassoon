name: Release

# Phase 10 (PLAN §10): tag `v*` → signed R8-shrunk APKs attached to the release.
# Keystore: base64 of keystore/release.keystore in the repo secret SIGNING_KEY;
# the store/key password in SIGNING_PASS. The keystore is reused forever — a
# key change blocks updates (Android refuses an upgrade with a new signer).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper + dependency cache (same as ci.yml) — release builds
      # no longer re-download the whole dependency tree on every tag.
      - name: Setup Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "$SIGNING_KEY" | base64 -d > keystore/release.keystore
          test -s keystore/release.keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build signed release APKs
        # --build-cache: mobile + TV share the same plugin/stdlib compile
        # outputs within one invocation.
        run: ./gradlew :app-mobile:assembleRelease :app-tv:assembleRelease --console=plain --build-cache -Dorg.gradle.jvmargs=-Xmx3g -PversionTag=${{ github.ref_name }}
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}

      - name: Verify signatures + stamp obtainium-friendly names
        run: |
          for apk in app-mobile/build/outputs/apk/release/app-mobile-release.apk app-tv/build/outputs/apk/release/app-tv-release.apk; do
            unzip -l "$apk" | grep -q "META-INF" || { echo "UNSIGNED: $apk"; exit 1; }
          done
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app-mobile/build/outputs/apk/release/app-mobile-release.apk "dist/GiffyViewer-mobile-${v}.apk"
          cp app-tv/build/outputs/apk/release/app-tv-release.apk "dist/GiffyViewer-tv-${v}.apk"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GiffyViewer-mobile-*.apk
            dist/GiffyViewer-tv-*.apk
          generate_release_notes: true
          body: |
            Unofficial upstream viewer. Not affiliated with or endorsed by upstream.
            Install the APK matching your device: `app-mobile` (phones/tablets) or
            `app-tv` (Android TV). GitHub-Releases-only distribution.
