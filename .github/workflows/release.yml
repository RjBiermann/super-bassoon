name: Release

# Phase 10 (PLAN §10): tag `v*` → signed R8-shrunk APKs attached to the release.
# Keystore: base64 of keystore/release.keystore in the repo secret SIGNING_KEY;
# the store/key password in SIGNING_PASS. The keystore is reused forever — a
# key change blocks updates (Android refuses an upgrade with a new signer).
on:
  push:
    tags: ["v*"]
  # Manual runs only to skip the HEAD guard below (input); the normal path is
  # a tag pushed by cut-release.yml.
  workflow_dispatch:
    inputs:
      skip_head_guard:
        description: "Skip the tag==default-branch-HEAD guard"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard against the silent-release-of-stale-commit class (batch-23
      # incident): the triggering tag must point at the default branch's
      # current HEAD. Tags are cut from HEAD by cut-release.yml, so a mismatch
      # means the tag was moved/created against a stale commit. Informational
      # fail-fast; a manual dispatch can opt out via the input above.
      - name: "Guard: tag points at default-branch HEAD"
        if: inputs.skip_head_guard != true
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          git fetch --no-tags --depth=1 origin "refs/heads/$default_branch"
          head_sha="$(git rev-parse FETCH_HEAD)"
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [ "$tag_sha" != "$head_sha" ]; then
            echo "::error::tag $GITHUB_REF_NAME points at $tag_sha, but default branch '$default_branch' HEAD is $head_sha — stale commit. Re-cut the tag via cut-release.yml (do not move tags)."
            exit 1
          fi
          echo "tag == $default_branch HEAD ($head_sha) OK"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper + dependency cache (same as ci.yml) — release builds
      # no longer re-download the whole dependency tree on every tag.
      - name: Setup Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "$SIGNING_KEY" | base64 -d > keystore/release.keystore
          test -s keystore/release.keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build signed release APKs
        # --build-cache: mobile + TV share the same plugin/stdlib compile
        # outputs within one invocation.
        run: ./gradlew :app-mobile:assembleRelease :app-tv:assembleRelease --console=plain --build-cache -Dorg.gradle.jvmargs=-Xmx3g -PversionTag=${{ github.ref_name }}
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}

      - name: Verify signatures + stamp obtainium-friendly names
        run: |
          for apk in app-mobile/build/outputs/apk/release/app-mobile-release.apk app-tv/build/outputs/apk/release/app-tv-release.apk; do
            unzip -l "$apk" | grep -q "META-INF" || { echo "UNSIGNED: $apk"; exit 1; }
          done
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app-mobile/build/outputs/apk/release/app-mobile-release.apk "dist/GiffyViewer-mobile-${v}.apk"
          cp app-tv/build/outputs/apk/release/app-tv-release.apk "dist/GiffyViewer-tv-${v}.apk"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GiffyViewer-mobile-*.apk
            dist/GiffyViewer-tv-*.apk
          generate_release_notes: true
          body: |
            Unofficial upstream viewer. Not affiliated with or endorsed by upstream.
            Install the APK matching your device: `app-mobile` (phones/tablets) or
            `app-tv` (Android TV). GitHub-Releases-only distribution.
