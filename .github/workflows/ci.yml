name: CI

# Standard FOSS gate: every push to main and every PR builds the project and
# runs the repo's own checks (ktlint, detekt, unit tests, debug+release-ish
# compilation via Gradle `build`). A red tree cannot sneak into a tag — release.yml
# (tag-driven signing + GitHub Release) runs separately on `v*` tags only.
on:
  push:
    branches: ["main"]
    # Docs-only pushes (README, LICENSE, AGENTS specs) can't affect a single
    # .kt file — skip the build gate; code+docs commits still run (only pure
    # doc pushes match the ignore set).
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle wrapper + downloaded/extracted dependency tree
      # across runs (gradle/actions dependency caching). setup-java already
      # caches the JDK itself.
      - name: Setup Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Build + checks (ktlint / detekt / unit tests)
        # `check` = lint + unit tests over every module. Release SIGNING is NOT
        # a CI concern — assembleRelease (and its validateSigning) belongs to
        # release.yml, which carries the keystore secrets. Debug APKs here cover
        # full compile parity for both app shells.
        # --build-cache: both app modules + all libs reuse compile outputs
        # within the one invocation (no cross-run state to trust).
        run: ./gradlew :app-mobile:assembleDebug :app-tv:assembleDebug check --console=plain --build-cache -Dorg.gradle.jvmargs=-Xmx3g --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
