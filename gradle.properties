# Project-wide Gradle settings.
# Memory-capped build (house rule): 3G gradle daemon, 2G kotlin daemon, 4 workers.
# NOTE: no org.gradle.java.home here — it would break on other machines/CI;
# JAVA_HOME decides, like on every host (this one exports it in the shell).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AGP 9 built-in Kotlin off — we drive Kotlin explicitly via the version catalog.
android.builtInKotlin=false
# External KGP is incompatible with AGP 9's new DSL; bypass until we migrate to built-in Kotlin.
android.newDsl=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
